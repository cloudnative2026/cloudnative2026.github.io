server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/catalog { proxy_pass http://ms-catalog:8080; }
    location /api/v1/orders { proxy_pass http://ms-orders:8080; }
    location /api/v1/notifications {
        proxy_pass http://ms-notifications:8080;
        # SSE: entregar cada evento apenas llega, sin cortar la conexion abierta
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
